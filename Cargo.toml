[package]
name = "storage-exit-check"
version = "0.1.0"
edition = "2021"
description = "Read-only evidence for a cloud-storage exit"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-storage-exit-check"
keywords = ["backup", "migration", "storage", "cli"]
categories = ["command-line-utilities", "filesystem"]
exclude = [
  "site/",
  ".factory/",
  "tests/",
  "dist/",
  "AGENTS.md",
  "package.json",
  "package-lock.json",
  "playwright.config.ts",
]

[[bin]]
name = "storage-exit-check"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
